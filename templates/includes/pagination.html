{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Pagination">{% if page_obj.has_previous %}<a class="button button-outline" href="?{{ filter_query }}{% if query %}&q={{ query|urlencode }}{% endif %}{% if request.GET.status %}&status={{ request.GET.status }}{% endif %}&page={{ page_obj.previous_page_number }}">← Previous</a>{% endif %}<span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="button button-outline" href="?{{ filter_query }}{% if query %}&q={{ query|urlencode }}{% endif %}{% if request.GET.status %}&status={{ request.GET.status }}{% endif %}&page={{ page_obj.next_page_number }}">Next →</a>{% endif %}</nav>{% endif %}
